<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>休息日历</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
  /* Layout: month grid on the left, one side panel (summary, selected day, settings, long weekends) on the right; stacked on phones. */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --fg: #17212b;
    --muted: #5b6874;
    --line: #d5dce3;
    --rest: #e4e9ef;
    --hol: #0c7468;
    --hol-bg: #d3eee9;
    --period: #c6325f;
    --period-bg: #fbdde6;
    --on-period: #ffffff;
    --fertile: #b87a0a;
    --today: #2b4c8c;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e151c; --surface: #17212b; --fg: #e6ecf1; --muted: #93a1ae; --line: #2a3743;
      --rest: #202c38; --hol: #5fd0c0; --hol-bg: #123a36; --period: #f0668f; --period-bg: #4a1b2b;
      --on-period: #2a0a15; --fertile: #e3ae3e; --today: #8fb1f0; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e151c; --surface: #17212b; --fg: #e6ecf1; --muted: #93a1ae; --line: #2a3743;
    --rest: #202c38; --hol: #5fd0c0; --hol-bg: #123a36; --period: #f0668f; --period-bg: #4a1b2b;
    --on-period: #2a0a15; --fertile: #e3ae3e; --today: #8fb1f0; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 14px/1.55 var(--font-body);
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 16px; }
  h1 { font: 700 24px/1.25 var(--font-display); margin: 0 0 2px; text-wrap: balance; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .cal { padding: 12px; }
  .calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .calhead h2 { flex: 1; margin: 0; text-align: center; font: 600 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  .nav, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; }
  .nav { width: 38px; height: 38px; font-size: 20px; line-height: 1; }
  .nav:disabled { opacity: .35; cursor: default; }
  .btn { padding: 8px 12px; min-height: 38px; }
  .btn.small { padding: 6px 12px; }
  .btn.primary { background: var(--period); color: var(--on-period); border-color: transparent; font-weight: 500; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--today); outline-offset: 2px; }
  .dow, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
  .dow span { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
  .dow span:first-child, .dow span:last-child { color: var(--fg); }
  .blank { min-height: 88px; }
  .day {
    appearance: none; border: 0; background: transparent; position: relative;
    min-height: 88px; padding: 8px 2px 4px; border-radius: 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0;
  }
  .day.we, .day.myrest { background: var(--rest); }
  .day.hol { background: var(--hol-bg); }
  .day.sel { box-shadow: inset 0 0 0 2px var(--fg); }
  .day.today::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--today); }
  .num { width: 32px; height: 32px; font-size: 16px; display: grid; place-items: center; border-radius: 50%; font-weight: 500; font-variant-numeric: tabular-nums; border: 1.5px solid transparent; }
  .num.pa { background: var(--period); color: var(--on-period); }
  .num.pp { background: var(--period-bg); color: var(--period); border: 1.5px dashed var(--period); }

  .day.hol .tag { color: var(--hol); font-weight: 500; }
  .marks { height: 8px; display: flex; align-items: center; gap: 3px; }
  .fert { width: 12px; height: 3px; border-radius: 2px; background: var(--fertile); display: inline-block; }
  .ovu { width: 8px; height: 8px; border-radius: 50%; background: var(--fertile); display: inline-block; }
  .legend { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--muted); }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; }
  .sw.hol { background: var(--hol-bg); box-shadow: inset 0 0 0 1px var(--hol); }
  .sw.rest { background: var(--rest); }
  .sw.pa { background: var(--period); border-radius: 50%; }
  .sw.pp { background: var(--period-bg); border: 1.5px dashed var(--period); border-radius: 50%; }
  .sw.fert { height: 3px; width: 14px; background: var(--fertile); border-radius: 2px; }
  .sw.ovu { width: 8px; height: 8px; border-radius: 50%; background: var(--fertile); margin: 0 4px; }
  .brushbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; align-items: center; }
  .brush, .shiftbtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
  .brush .dot, .shiftbtn .dot, .stats .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sc, var(--muted)); display: inline-block; flex: none; }
  .brush[aria-pressed="true"], .shiftbtn[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); font-weight: 500; }
  .hint { margin: 0 0 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .day.shift { background: var(--sc); color: var(--sf); }
  .day.shift.sel { box-shadow: 0 0 0 3px var(--fg); z-index: 1; }
  .day.shift .num { color: var(--sf); font-weight: 700; }
  .day.shift .num.pa, .day.shift .num.pp { background: var(--surface); color: var(--period); border: 2px solid var(--period); }
  .day.shift .tag { color: var(--sf); font-weight: 700; font-size: 13px; min-height: 16px; }
  .day.shift.today::after { background: var(--sf); }
  .day.shift .marks .fert, .day.shift .marks .ovu { background: var(--sf); }
  .day.shift .hb { background: var(--sf); color: var(--sc); }
  .day.sel:not(.shift) { box-shadow: inset 0 0 0 3px var(--fg); }
  .hb { position: absolute; top: 5px; left: 4px; font-style: normal; font-size: 9px; line-height: 1; padding: 2px 3px; border-radius: 3px; background: var(--hol); color: var(--surface); }
  .stats { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  .stats span { display: inline-flex; align-items: center; gap: 5px; }
  .shiftrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  input[type="color"] { width: 40px; height: 36px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
  input[type="text"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
  .btn:disabled { opacity: .4; cursor: default; }
  .savecard { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; margin-bottom: 16px; }
  .savecard.dirty { border-color: var(--fertile); box-shadow: 0 0 0 2px var(--fertile); }
  .savecard.bad { border-color: var(--period); box-shadow: 0 0 0 2px var(--period); }
  .savetext { display: grid; gap: 1px; min-width: 0; }
  .savetext b { font-size: 15px; }
  .savetext .muted { font-size: 12px; }
  .btn.save { background: var(--today); color: var(--surface); border-color: transparent; font-weight: 700; font-size: 16px; padding: 10px 28px; min-height: 46px; flex: none; }
  .btn.save:disabled { opacity: .5; cursor: default; }
  .btn.save.dirty { box-shadow: 0 0 0 3px var(--fertile); }
  .btn.save.bad { background: var(--period); color: var(--on-period); }
  .day.prov { border: 1.5px dashed var(--hol); background: transparent; padding-top: 6.5px; }
  .day.prov .tag { color: var(--hol); }
  .day.work .tag { color: var(--fg); font-weight: 700; }
  .day.work .num { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .sw.work { background: var(--surface); border: 1.5px solid var(--fg); border-radius: 50%; }
  .sw.prov { background: transparent; border: 1.5px dashed var(--hol); }
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 12, 16, .6); overflow-y: auto; display: flex; justify-content: center; align-items: flex-start;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .overlay[hidden] { display: none; }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 100%; max-width: 520px; display: grid; gap: 12px; min-width: 0; }
  .sheet img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); display: block; }
  .sheet p { margin: 0; font-size: 13px; }
  .sheet .row { margin-top: 0; }
  .evt { font-size: 10px; line-height: 1.35; font-weight: 700; padding: 1px 5px; margin-top: 2px; border-radius: 6px; background: var(--fg); color: var(--surface); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evform { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .evform input[type="date"] { grid-column: 1 / -1; display: block; box-sizing: border-box; max-width: 100%; inline-size: 100%; -webkit-appearance: none; appearance: none; text-align: left; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; min-height: 40px; }
  .evform .btn.save { font-size: 14px; padding: 8px 18px; min-height: 40px; }
  #evlist { margin-top: 12px; display: grid; gap: 8px; }
  .evrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .evrow.past { opacity: .6; }
  .evgo { border: 0; background: var(--rest); border-radius: 8px; padding: 8px 10px; min-height: 38px; cursor: pointer; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .evin { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; min-height: 38px; }
  .savetag { color: var(--hol); font-size: 12px; }
  .savetag.bad { color: var(--period); }
  .pblock { margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--period-bg); display: grid; gap: 8px; }
  .pblock b { font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper .val { min-width: 4.5em; text-align: center; font: 600 18px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .stepper .nav { width: 40px; height: 40px; }
  .side { padding: 0; min-width: 0; }
  .blk { padding: 16px; border-top: 1px solid var(--line); }
  .blk:first-child { border-top: 0; }
  h3 { margin: 0 0 8px; font: 700 12px/1.3 var(--font-body); letter-spacing: .08em; color: var(--muted); }
  .big { font: 600 20px/1.3 var(--font-display); margin: 0; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--rest); }
  .chip.hol { background: var(--hol-bg); color: var(--hol); }
  .chip.per { background: var(--period-bg); color: var(--period); }
  .chip.fer { background: var(--rest); color: var(--fertile); }
  .stat + .stat { margin-top: 12px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type="number"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; font-variant-numeric: tabular-nums; }
  .note { margin: 10px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--period-bg); color: var(--fg); font-size: 12px; }
  .note .btn { margin-top: 8px; }
  ul.runs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  ul.runs li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; }
  ul.runs li:first-child { border-top: 0; padding-top: 0; }
  .when { font-variant-numeric: tabular-nums; font-weight: 500; }
  .what { color: var(--muted); font-size: 13px; }
  .what b { color: var(--hol); font-weight: 500; }
  .more { margin-top: 8px; }
  .foot { margin: 16px 0 0; color: var(--muted); font-size: 12px; max-width: 70ch; }
  @media (max-width: 480px) { .num { width: 26px; height: 26px; font-size: 14px; } .day, .blank { min-height: 72px; } .day.shift .tag { font-size: 12px; } .cal { padding: 8px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>休息日历</h1>
    <p class="sub">中国大陆 · 周六日休息 · 含调休上班 · 2027 年放假安排待国务院公布</p>
  </header>
  <div class="grid">
    <section class="panel cal" aria-label="月历">
      <div class="calhead">
        <button class="nav" id="prev" aria-label="上个月">‹</button>
        <h2 id="mtitle"></h2>
        <button class="nav" id="next" aria-label="下个月">›</button>
        <button class="btn small" id="gotoday">今天</button>
      </div>
      <div class="brushbar" id="brushbar"></div>
      <p class="hint" id="hint"></p>
      <div class="dow" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="days" id="days"></div>
      <ul class="legend">
        <li><i class="sw hol"></i>节假日</li>
        <li><i class="sw rest"></i>休息日</li>
        <li><i class="sw work"></i>调休上班</li>
        <li><i class="sw prov"></i>待公布的节日</li>
      </ul>
      <div class="stats" id="stats"></div>
      <div class="row"><button type="button" class="btn" id="exportbtn">把这个月保存为图片</button><button type="button" class="btn save" id="savebtn">保存</button></div>
    </section>
    <aside class="panel side">
      <section class="blk" id="detail"></section>
      <section class="blk" id="events">
        <h3>重要事件</h3>
        <div class="evform">
          <input type="date" id="evdate" aria-label="事件日期">
          <input type="text" id="evtitle" maxlength="20" placeholder="比如：考试、马拉松" aria-label="事件名称">
          <button type="button" class="btn save" id="evadd">添加</button>
        </div>
        <div id="evlist"></div>
      </section>
      <section class="blk">
        <h3>班次设置</h3>
        <div id="shifteditor"></div>
        <button type="button" class="btn small" id="addshift">添加班次</button>
      </section>
      <section class="blk">
        <h3>接下来的连休</h3>
        <ul class="runs" id="runs"></ul>
        <button class="btn small more" id="more" hidden></button>
      </section>
    </aside>
  </div>
  <div class="overlay" id="ov" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="月历图片">
      <img id="ovimg" alt="月历图片">
      <p class="muted" id="ovstyle"></p>
      <p class="muted" id="ovmsg">点“保存图片”，或在手机上长按图片，选“存储到相册”。</p>
      <div class="row"><button type="button" class="btn save" id="ovsave">保存图片</button><button type="button" class="btn" id="ovshuffle">换一个背景</button><button type="button" class="btn" id="ovclose">关闭</button></div>
    </div>
  </div>
  <p class="foot">节假日按国务院办公厅 2025 年 11 月公布的 2026 年安排整理。2027 年的放假和调休通常在 2026 年 11 月公布，现在只标出法定节日的日期（虚线），公布后可以补上。</p>
</div>

<script>
(function () {

  function wd(n) { return '周' + WD[parts(n).w]; }
  function full(n) { var p = parts(n); return p.y + '年' + z2(p.m) + '月' + z2(p.d) + '日'; }

  var now = new Date();

  var END = dn(2028, 1, 2);

  // Mainland China. 2026 follows the State Council notice of 4 Nov 2025. 2027 is not published yet, so only fixed statutory days are shown, dashed.
  var H = {}, W = {};
  function add(y, m, d, s, f, g, p) { H[dn(y, m, d)] = { s: s, f: f, g: g || f, p: !!p }; }
  function work(y, m, d, f) { W[dn(y, m, d)] = f; }
  add(2026, 10, 1, '国庆节', '国庆节（10月1日至7日放假）', '国庆节');
  for (var gq = 2; gq <= 7; gq++) add(2026, 10, gq, '国庆', '国庆节（10月1日至7日放假）', '国庆节');
  work(2026, 10, 10, '调休上班（国庆节）');
  add(2027, 1, 1, '元旦', '元旦（放假与调休安排待国务院公布）', '元旦', true);
  add(2027, 2, 5, '除夕', '除夕（放假与调休安排待国务院公布）', '春节', true);
  add(2027, 2, 6, '春节', '春节（放假与调休安排待国务院公布）', '春节', true);
  add(2027, 4, 5, '清明', '清明节（放假与调休安排待国务院公布）', '清明节', true);
  add(2027, 5, 1, '劳动节', '劳动节（放假与调休安排待国务院公布）', '劳动节', true);
  add(2027, 6, 9, '端午', '端午节（放假与调休安排待国务院公布）', '端午节', true);
  add(2027, 9, 15, '中秋', '中秋节（放假与调休安排待国务院公布）', '中秋节', true);
  add(2027, 10, 1, '国庆节', '国庆节（放假与调休安排待国务院公布）', '国庆节', true);

  var KEY = 'holiday-cycle-cal-v1';
  var dirty = false, savedAt = 0, dbDoc = null, cloud = 'pending', saveMsg = '', saveBad = false, saving = false;
  function defaults() { return {}; }
  function normalize(o) {
    if (!o || typeof o !== 'object') o = defaults();
    if (!Array.isArray(o.shifts)) o.shifts = [
      { id: 'day', name: '白班', color: '#e5484d' },

      { id: 'rest', name: '休息', color: '#3e9b6e' }
    ];

  function drawMonth(styleIdx, seed) {

    var IH = evTop + mev.length * 36 + M + 22;

    c.textAlign = 'center';
    var names = ['日', '一', '二', '三', '四', '五', '六'];
    c.font = '500 22px ' + FONT; c.fillStyle = T.sub;

      var h = H[n], wk = W[n], we = isWeekend(n) && !wk, sh = smap[st.assign[n]], inf = cs.info[n] || {};

      else if (sure) { c.fillStyle = T.hol; c.fill(); tagC = T.holTag; tag = h.s; }
      else if (h) { c.setLineDash([6, 4]); c.lineWidth = 2; c.strokeStyle = T.holTag; c.stroke(); c.setLineDash([]); tagC = T.holTag; tag = h.s; }
      else if (wk) { c.lineWidth = 2; c.strokeStyle = T.fg; c.stroke(); tag = '上班'; }
      else if (we) { c.fillStyle = T.rest; c.fill(); }
      if (sh && h && !sure) { c.setLineDash([6, 4]); c.lineWidth = 2; c.strokeStyle = fg; c.stroke(); c.setLineDash([]); }
      var ny = yy + 38;
      if (inf.per) {
        c.beginPath(); c.arc(cx, ny, 19, 0, Math.PI * 2);

  var shot = null, shotUrl = null, lastStyle = -1;
